<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroTab</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: var(--font-family);
      background: linear-gradient(135deg, #0b2239 0%, #034870 50%, #00b4d8 100%);
      color: #ffffff;
      box-sizing: border-box;
      user-select: none;
      overflow: hidden;
    }

    .popup-card {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(20px) saturate(160%);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 30px rgba(0, 15, 35, 0.45), inset 0 1px 2px #fff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    /* Specular Lens Glare */
    .popup-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: var(--glass-lens-glare);
      pointer-events: none;
      z-index: 1;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .popup-orb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #ffffff 0%, #7fe4ff 35%, #00b4d8 65%, #004d80 100%);
      border: 1.5px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 20, 50, 0.4), inset 0 1px 2px #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .popup-title-group {
      display: flex;
      flex-direction: column;
    }

    .popup-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 20, 50, 0.9);
    }

    .popup-subtitle {
      font-size: 10px;
      font-weight: 600;
      color: #d0f2ff;
      text-shadow: 0 1px 2px rgba(0, 20, 50, 0.8);
    }

    /* Now Playing Track Pill */
    .popup-track-box {
      background: rgba(0, 20, 45, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 2;
    }

    .popup-track-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .popup-track-name {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .popup-track-status {
      font-size: 9px;
      color: #7fddff;
      font-weight: 600;
    }

    .popup-play-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #b8f2ff 0%, #00b4d8 50%, #0077b6 100%);
      border: 1px solid #ffffff;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0, 180, 216, 0.6), inset 0 1px 1px #fff;
      transition: transform 150ms ease;
    }

    .popup-play-btn:hover {
      transform: scale(1.12);
    }

    /* Quick Theme Chips */
    .popup-section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #d0f0ff;
      position: relative;
      z-index: 2;
    }

    .popup-theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      position: relative;
      z-index: 2;
    }

    .popup-theme-chip {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 150ms ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .popup-theme-chip:hover {
      background: rgba(255, 255, 255, 0.45);
      border-color: #ffffff;
      transform: translateY(-1px);
    }

    /* Open New Tab Action */
    .popup-open-btn {
      width: 100%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.95) 0%,
        rgba(255, 255, 255, 0.6) 48%,
        rgba(180, 235, 255, 0.45) 50%,
        rgba(255, 255, 255, 0.8) 100%
      );
      border: 1.5px solid #ffffff;
      border-radius: var(--radius-pill);
      padding: 8px 12px;
      color: #034870;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(0, 20, 50, 0.35), inset 0 1px 2px #fff;
      transition: all 150ms ease;
      position: relative;
      z-index: 2;
    }

    .popup-open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 180, 216, 0.6), inset 0 1px 2px #fff;
      color: #002244;
    }
  </style>
</head>
<body>
  <div class="popup-card">
    <div class="popup-header">
      <div class="popup-orb">🌊</div>
      <div class="popup-title-group">
        <span class="popup-title">AeroTab Suite</span>
        <span class="popup-subtitle">Frutiger Aero Extension Active</span>
      </div>
    </div>

    <!-- Active Soundtrack -->
    <div class="popup-track-box">
      <div class="popup-track-info">
        <span class="popup-track-name" id="popup-track-name">🎮 Editing a Mii (Mii Maker)</span>
        <span class="popup-track-status">Default Anthem</span>
      </div>
      <button class="popup-play-btn" id="popup-open-tab-btn" title="Open AeroTab">▶</button>
    </div>

    <!-- Quick Theme Selection -->
    <span class="popup-section-title">Quick Worlds</span>
    <div class="popup-theme-grid">
      <button class="popup-theme-chip" data-theme="windows-vista">🌈 Vista Aurora</button>
      <button class="popup-theme-chip" data-theme="aqua-aquarium">🐠 Aqua Reef</button>
      <button class="popup-theme-chip" data-theme="eco-hills">🌿 Eco Lawn</button>
      <button class="popup-theme-chip" data-theme="dark-aero-ultimate">🌌 Dark Vista</button>
    </div>

    <!-- Main CTA -->
    <button class="popup-open-btn" id="btn-open-dashboard">
      <span>🌐 Open AeroTab New Tab</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
