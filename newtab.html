<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroTab — Frutiger Aero Dashboard</title>
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/taskbar.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
  <!-- Full-screen Living Animated Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Main Application Container -->
  <div id="app" class="app-container">

    <!-- Left Sidebar: Vista Style Gadgets -->
    <aside class="sidebar sidebar-left">
      <!-- Analog Clock Gadget -->
      <section id="analog-clock-widget" class="widget glass-panel animate-fade-in-up stagger-1">
        <div class="widget-header">
          <span class="widget-title">Aero Clock</span>
        </div>
        <div class="widget-body">
          <canvas id="analog-clock-canvas" width="160" height="160"></canvas>
        </div>
      </section>

      <!-- Weather Gadget -->
      <section id="weather-widget" class="widget glass-panel animate-fade-in-up stagger-2">
        <div class="widget-header">
          <span class="widget-title">Atmosphere</span>
          <button id="refresh-weather-btn" class="widget-action-btn" title="Refresh weather">↻</button>
        </div>
        <div class="widget-body">
          <div id="weather-content" class="weather-content">
            <p class="weather-loading">Loading forecast...</p>
          </div>
        </div>
      </section>

      <!-- Windows Media Player Gadget -->
      <section id="media-player-widget" class="widget glass-panel media-player-widget animate-fade-in-up stagger-3">
        <div class="widget-header">
          <span class="widget-title">Aero Sound Player</span>
          <div class="player-header-actions">
            <span id="player-track-counter" class="player-counter">8 / 12</span>
            <button id="player-playlist-toggle-btn" class="widget-action-btn" title="Toggle 12-Track Playlist">📋</button>
          </div>
        </div>
        <div class="widget-body">
          <div class="player-track-info">
            <div id="player-track-title" class="player-track-title">🎮 Editing a Mii (Mii Maker)</div>
            <div id="player-track-artist" class="player-track-artist">Nintendo Wii U (Retanoze)</div>
          </div>
          <!-- Seek Timeline -->
          <div class="player-timeline-container">
            <div id="player-progress-track" class="player-progress-track" title="Click to seek">
              <div id="player-progress-bar" class="player-progress-bar"></div>
            </div>
            <div class="player-time-display">
              <span id="player-current-time">0:00</span>
              <span id="player-duration-time">--:--</span>
            </div>
          </div>
          <!-- Bouncing Visualizer Bars -->
          <div class="player-visualizer">
            <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
            <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
            <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
            <div class="viz-bar"></div><div class="viz-bar"></div><div class="viz-bar"></div>
          </div>
          <!-- Tactile WMP Controls -->
          <div class="player-controls">
            <button id="player-prev-btn" class="player-btn" title="Previous Track">⏮</button>
            <button id="player-play-btn" class="player-btn play-btn" title="Play / Pause">▶</button>
            <button id="player-next-btn" class="player-btn" title="Next Track">⏭</button>
          </div>
          <!-- Expandable 12-Song Playlist Tray -->
          <div id="player-playlist-tray" class="player-playlist-tray" style="display: none;">
            <!-- Populated by JS -->
          </div>
        </div>
      </section>
    </aside>

    <!-- Center Stage: Greeting, Today's Focus & Large Digital Clock -->
    <main class="main-content">
      <!-- Greeting & Focus Goal -->
      <section id="greeting-section" class="greeting-section animate-fade-in-up stagger-2">
        <h1 id="greeting-text" class="greeting-text">Welcome back.</h1>
        <div id="focus-container" class="focus-container">
          <input type="text" id="focus-input" class="focus-input"
                 placeholder="What is your main focus today?" maxlength="120" autocomplete="off">
          <p id="focus-display" class="focus-display" style="display: none;"></p>
        </div>
      </section>

      <!-- Central Digital Clock & Gregorian Date -->
      <section id="clock-section" class="clock-section animate-fade-in-up stagger-3">
        <div id="digital-clock" class="digital-clock">12:00</div>
        <div id="date-display" class="date-display">Monday, October 13</div>
      </section>
    </main>

    <!-- Right Sidebar: Tasks & Quick Launch Links -->
    <aside class="sidebar sidebar-right">
      <!-- Tasks / Sticky Notes Gadget -->
      <section id="tasks-widget" class="widget glass-panel animate-fade-in-up stagger-2">
        <div class="widget-header">
          <span class="widget-title">Focus Tasks</span>
          <button id="add-task-btn" class="widget-action-btn" title="Add task">+</button>
        </div>
        <div class="widget-body">
          <ul id="tasks-list" class="tasks-list">
            <!-- Populated by JS -->
          </ul>
          <div id="add-task-form" class="add-task-form" style="display: none;">
            <input type="text" id="new-task-input" class="glass-input"
                   placeholder="Enter a task and hit Enter..." maxlength="80">
          </div>
        </div>
      </section>

      <!-- Quick Launch Links / Bookmarks Gadget -->
      <section id="bookmarks-widget" class="widget glass-panel animate-fade-in-up stagger-3">
        <div class="widget-header">
          <span class="widget-title">Quick Launch</span>
          <button id="add-bookmark-btn" class="widget-action-btn" title="Add shortcut">+</button>
        </div>
        <div class="widget-body">
          <div id="bookmarks-grid" class="bookmarks-grid">
            <!-- Populated by JS -->
          </div>
          <div id="add-bookmark-form" class="add-bookmark-form" style="display: none; margin-top: 10px;">
            <input type="text" id="new-bookmark-label" class="glass-input" placeholder="Title (e.g. YouTube)" style="width:100%; margin-bottom:6px;">
            <input type="url" id="new-bookmark-url" class="glass-input" placeholder="URL (https://...)" style="width:100%; margin-bottom:6px;">
            <div style="display:flex; gap:6px;">
              <button id="save-bookmark-btn" class="glass-button" style="flex:1; padding:4px 8px; font-size:11px;">Save</button>
              <button id="cancel-bookmark-btn" class="glass-button" style="padding:4px 8px; font-size:11px;">Cancel</button>
            </div>
          </div>
        </div>
      </section>
    </aside>

    <!-- Windows Vista / 7 Style Taskbar -->
    <nav class="taskbar">
      <div class="taskbar-left">
        <button id="start-btn" class="start-button" title="AeroTab Menu">
          <span class="start-orb"></span>
          <span class="start-label">AeroTab</span>
        </button>
      </div>

      <div class="taskbar-center">
        <!-- Ambient Sound Toggle -->
        <button id="sound-toggle-btn" class="taskbar-btn" title="Ambient Soundscape (Click to toggle mixer)">
          🔇
        </button>
      </div>

      <div class="taskbar-right">
        <button id="theme-btn" class="taskbar-btn" title="Switch Theme Preset">🎨</button>
        <button id="settings-btn" class="taskbar-btn" title="Settings & Customization">⚙️</button>
        <div id="taskbar-clock" class="taskbar-clock">12:00 PM</div>
      </div>
    </nav>

    <!-- Ambient Soundscape Mixer Flyout Panel -->
    <div id="sound-mixer-panel" class="sound-mixer-panel glass-panel" style="display: none;">
      <div class="widget-header">
        <span class="widget-title">Ambient Soundscapes</span>
        <button id="close-sound-mixer" class="widget-action-btn" title="Close">×</button>
      </div>
      <div id="sound-mixer-body" class="sound-mixer-body">
        <!-- Populated by sound-engine.js -->
      </div>
    </div>

    <!-- Slide-in Settings Panel -->
    <div id="settings-panel" class="settings-panel" style="display: none;">
      <!-- Populated by settings.js -->
    </div>

    <!-- Backdrop for Settings -->
    <div id="settings-overlay" class="settings-overlay" style="display: none;"></div>

  </div>

  <!-- Application Logic Scripts in Execution Order -->
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/background-engine.js"></script>
  <script src="js/greeting.js"></script>
  <script src="js/clock-widget.js"></script>
  <script src="js/weather-widget.js"></script>
  <script src="js/tasks-widget.js"></script>
  <script src="js/bookmarks-widget.js"></script>
  <script src="js/sound-engine.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
